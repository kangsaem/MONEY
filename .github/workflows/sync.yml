# moneypiee(main) → 이 저장소 main에 그대로 복사(광고만 뺌) + Pages 배포. 10분마다.
name: sync-from-moneypiee
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          path: me
      - uses: actions/checkout@v4
        with:
          repository: kangsaem/moneypiee
          path: src
      - name: 복사
        run: |
          SHA=$(git -C src rev-parse HEAD)
          rsync -a --delete --exclude .git --exclude .github --exclude CNAME src/ me/
          echo money.kangyonz.com > me/CNAME
          echo "$SHA" > me/.sync-sha
          python3 - <<'PY'
          import glob, re
          for p in glob.glob('me/**/*.html', recursive=True):
              s = open(p, encoding='utf-8', errors='surrogateescape').read()
              t = re.sub(r'<script[^>]*adsbygoogle\.js[^>]*>\s*</script>', '', s)
              t = re.sub(r'<div id="adfit-bottom">.*?</div>', '', t, flags=re.S)
              if t != s: open(p, 'w', encoding='utf-8', errors='surrogateescape').write(t)
          PY
          cd me
          git config user.name 'sync-bot'; git config user.email 'sync-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo "변경 없음 $SHA"; else git commit -qm "sync moneypiee $SHA" && git push -q; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: me
      - uses: actions/deploy-pages@v4
